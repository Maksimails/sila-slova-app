<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Сила Слова</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Yeseva+One&family=Oswald:wght@600;700&family=Underdog&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10; --panel: #16181d; --border: #2a2d35; --text: #eceef2;
    --muted: #90959f; --gold: #e8b04b; --gold2: #f2c86b;
  }
  * { box-sizing: border-box; }
  /* фиксированная тёмная сцена везде — тот же язык, что и в карточках персонажей,
     сознательно не подстраиваемся под tg-theme, это часть бренда */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 19px; margin: 0 0 14px; }
  .card { border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .big { font-size: 24px; font-weight: 700; margin: 4px 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0; font-size: 15px; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
    background: linear-gradient(135deg, var(--gold), #c8862f); color: #1a1200; margin-top: 10px; }
  .btn-secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { margin-top: 16px; }
  .opt { border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  .opt b { display: block; font-size: 16px; margin-bottom: 3px; color: var(--gold2); }
  input[type="text"], input[type="date"], textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 16px; font-family: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  .chips { display: flex; gap: 8px; }
  .chip { flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); cursor: pointer; font-size: 14px; }
  .err { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 6px; }
  .progress { height: 5px; border-radius: 4px; background: #22242b; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .2s; }
  .footer-nav { display: flex; justify-content: center; gap: 20px; margin-top: 24px; font-size: 14px; }
  .footer-nav a { color: var(--muted); text-decoration: underline; cursor: pointer; }
  .bet-card { border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  .bet-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .bet-card .goal { font-size: 16px; font-weight: 600; }
  .bet-card .badge { font-size: 12px; color: var(--gold2); background: rgba(232,176,75,.15); padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .bet-card .meta { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .bet-card .bar { height: 4px; background: #22242b; border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bet-card .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  /* экран выбора проводника — карточки персонажей "как в игре" */
  .persona-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 4px; }
  .persona-opt { position: relative; border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    aspect-ratio: 3/4; cursor: pointer; background: var(--panel); }
  .persona-opt img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .persona-opt .shade { position: absolute; inset: 0; box-shadow: inset 0 -55px 45px -18px rgba(0,0,0,.9); }
  .persona-opt .p-name { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,.85); font-size: 15px; }
  .persona-opt.active { border-color: var(--gold); border-width: 2px; box-shadow: 0 0 0 3px rgba(232,176,75,.25); }
  .name-zina { font-family: 'Yeseva One', serif; color: #f4e2b8; }
  .name-arnold { font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: .02em; color: #e7e9ee; text-transform: uppercase; font-size: 13px !important; }
  .name-confucius { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; color: #f2e6c8; }
  .name-angela { font-family: 'Underdog', cursive; color: #ffb6d5;
    text-shadow: 0 1px 0 #7a2a4d, 0 2px 0 #6a2242, 0 3px 4px rgba(0,0,0,.7); font-size: 17px !important; }

  /* ---------- профиль игрока ---------- */
  .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .avatar-wrap { position: relative; width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--gold); flex-shrink: 0; cursor: pointer; background: var(--panel);
    display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: var(--gold2); }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-wrap .avatar-edit { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.6);
    font-size: 9px; text-align: center; padding: 3px 0; letter-spacing: .02em; }
  .profile-name { font-size: 19px; font-weight: 700; }
  .level-badge { display: inline-block; background: linear-gradient(135deg, var(--gold), #c8862f); color: #1a1200;
    font-weight: 700; font-size: 12px; padding: 2px 9px; border-radius: 20px; margin-top: 5px; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 18px 0 8px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .bar-label b { color: var(--text); font-weight: 600; }
  .bar-track { height: 8px; border-radius: 6px; background: #22242b; overflow: hidden; margin-bottom: 14px; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .bar-fill.trust { background: linear-gradient(90deg, #4a7a5a, #6fae82); }
  .bar-fill.drive { background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  .bar-fill.xp { background: linear-gradient(90deg, #7a5ac8, #a48ee8); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .stat-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .stat-box .num { font-size: 19px; font-weight: 700; color: var(--gold2); }
  .stat-box .lbl { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .bond-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .bond-row:last-child { border-bottom: none; }
  .bond-row img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .bond-row .bname { font-size: 14px; flex: 1; }
  .bond-row .blvl { font-size: 12px; color: var(--gold2); white-space: nowrap; }
  .medal-shelf { display: flex; flex-wrap: wrap; gap: 10px; }
  .medal { width: 58px; text-align: center; font-size: 10.5px; color: var(--muted); }
  .medal .micon { font-size: 26px; display: block; margin-bottom: 3px; }
  .medal.locked .micon { filter: grayscale(1) brightness(.55); }
  .medal.locked { opacity: .7; }
  .hardest-card { display: flex; align-items: center; gap: 10px; }
  .hardest-card .hicon { font-size: 26px; }

  /* ---------- мастер ставки v2 ---------- */
  .info-box { border: 1px solid var(--border); background: var(--panel); border-radius: 12px; padding: 12px 14px; }
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips-wrap .chip { flex: 0 0 auto; min-width: 46px; }
  .chip.active-chip { border-color: var(--gold); background: rgba(232,176,75,.15); color: var(--gold2); }
</style>
</head>
<body>
  <h1>Сила Слова</h1>
  <div id="app"><div class="empty">Загрузка…</div></div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const API = "https://mparfxpddlkfuixminnx.supabase.co/functions/v1/miniapp";
  const initData = tg?.initData || "";
  const TYPES = { result: "Результат", habit: "Привычка", quit: "Отказ" };
  const PERSONAS = { confucius: "Конфуций", arnold: "Физрук Арнольд", zina: "Баба Зина 🔞", angela: "Анжела Фокс" };
  // финальные портреты персонажей — те же файлы, что лежат в папке "Character Visuals",
  // залиты в этот же репозиторий на GitHub Pages рядом с index.html
  // изображения лежат в корне репозитория GitHub Pages, а этот файл — в /miniapp/,
  // поэтому путь на уровень выше (без этого префикса картинки просто 404 и не показываются)
  const PERSONA_IMG = { confucius: "../confucius.jpg", arnold: "../coach.jpg", zina: "../baba_zina.jpg", angela: "../angela_fox.jpg" };
  const PERSONA_FONT = { confucius: "name-confucius", arnold: "name-arnold", zina: "name-zina", angela: "name-angela" };

  // ---------- Мастер ставки v2 (см. Мастер_ставки_v2_PRD.md) ----------
  const EXAMPLES = {
    result: ["Похудеть на 8 кг", "Накопить 300 000 ₽", "Закрыть кредит", "Пробежать 10 км", "Выучить английский до B1", "Прочитать 12 книг", "Завершить обучение", "Запустить свой проект", "Получить водительские права", "Сделать ремонт", "Найти новую работу", "Набрать 5 кг"],
    habit: ["100 отжиманий в день", "Тренироваться 3 раза в неделю", "Проходить 10 000 шагов", "Читать 20 минут в день", "Учить английский 30 минут", "Медитировать каждое утро", "Ложиться до 23:00", "Выпивать 2 литра воды", "Делать 10 звонков клиентам", "Вести учёт расходов", "Писать по одной странице", "Делать зарядку по утрам"],
    quit: ["Без алкоголя", "Без сигарет", "Без сладкого", "Без фастфуда", "Без энергетиков", "Без ставок и казино", "Без импульсивных покупок", "Без соцсетей после 22:00", "Без телефона первый час после пробуждения", "Без компьютерных игр по будням", "Без еды после 20:00", "Без нецензурной речи"],
  };
  const HABIT_TIER_LABELS = { light: "Лайт", normie: "Норм", best_self: "Лучшая Версия Себя" };
  const WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"]; // индекс совпадает с WEEKDAYS_RU в бот/index.ts
  function formatRuDate(iso) {
    if (!iso) return "";
    const parts = iso.split("-");
    return parts[2] + "." + parts[1] + "." + parts[0];
  }

  let ctx = { user: null, bets: [], pending: [], draft: {}, step: 0 };

  function esc(s) { return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }
  function emptyMsg(t) { return '<div class="empty">' + t + "</div>"; }
  function closeApp() { tg?.close(); }
  window.closeApp = closeApp;

  async function api(path, opts) {
    opts = opts || {};
    const isForm = opts.body instanceof FormData;
    const headers = { "X-Init-Data": initData, ...(opts.headers || {}) };
    if (!isForm) headers["Content-Type"] = "application/json";
    return fetch(API + path, { ...opts, headers });
  }

  async function refreshStatus() {
    try {
      const r = await api("/status");
      const data = await r.json();
      if (r.ok) { ctx.user = data.user; ctx.bets = data.bets || []; ctx.pending = data.pending || []; ctx.reviewing = data.reviewing || []; }
    } catch (e) { /* молча — следующий рендер попробует снова */ }
    await refreshChallenges();
  }

  // ---------- Вызов (Challenge) — Фаза 1: 1:1. См. Вызов_фича_спека_v1.md ----------
  async function refreshChallenges() {
    try {
      const r = await api("/challenges-mine");
      const data = await r.json();
      if (r.ok) ctx.challenges = data.challenges || [];
    } catch (e) { /* молча */ }
  }

  async function boot() {
    const app = document.getElementById("app");
    if (!initData) { app.innerHTML = emptyMsg("Открой это через кнопку в боте — вне Telegram приложение не работает."); return; }
    try {
      const r = await api("/status");
      const data = await r.json();
      if (!r.ok) { app.innerHTML = emptyMsg("Не удалось проверить — открой заново через бота."); return; }
      ctx.user = data.user; ctx.bets = data.bets || []; ctx.pending = data.pending || []; ctx.reviewing = data.reviewing || [];
      await refreshChallenges();
      const params = new URLSearchParams(location.search);
      const chToken = params.get("challenge");
      if (chToken) { renderChallengeInvite(chToken); return; }
      renderHome();
    } catch (e) {
      app.innerHTML = emptyMsg("Ошибка соединения. Попробуй ещё раз.");
    }
  }

  function footerNav() {
    return '<div class="footer-nav"><a onclick="renderProfile()">👤 Профиль</a><a onclick="showInfo()">Как это работает</a><a onclick="closeApp()">Поддержка — в чате</a></div>';
  }
  window.showInfo = function () {
    document.getElementById("app").innerHTML =
      '<div class="card">' +
      "<p>Люди не достигают целей не потому, что не знают как. А потому, что за слив ничего не будет. Пообещал — забыл — никто не заметил.</p>" +
      "<p>1. Записываешь видео: «Даю слово, что…»<br>2. Ставишь на кон своё слово<br>3. Отчитываешься каждый день<br>4. Дошёл — герой. Слился — все узнают, чего стоит твоё слово.</p>" +
      "<p>Пропустил отчёт — слово не сдержано. Без запасных дней. Поэтому и работает.</p>" +
      "</div><button onclick=\"renderHome()\">Назад</button>";
  };

  window.renderHome = function () {
    const app = document.getElementById("app");
    if (!ctx.user || !ctx.user.age) {
      app.innerHTML = emptyMsg("Сначала пройди быстрый старт в чате бота — напиши боту /start.") + footerNav();
      return;
    }
    // ставки внутри Вызова — уже своя строка в bets (нужно для отчётов/персонажа/ставки),
    // но на глазах у пользователя не должны дублироваться с виджетом "Мои вызовы" ниже —
    // показываем их только там, а не вперемешку с обычными личными/публичными ставками.
    const bets = (ctx.bets || []).filter(function (b) { return !b.challenge_id; });
    const pending = (ctx.pending || []).filter(function (p) { return !p.challenge_id; });
    const reviewing = (ctx.reviewing || []).filter(function (r) { return !r.challenge_id; });
    let html = "";
    if (pending.length) {
      html += '<div class="muted" style="margin-bottom:10px">Ждут оплаты, чтобы стать словом:</div>';
      html += pending.map(function (p) {
        return '<div class="bet-card" style="border-style:dashed">' +
          '<div class="top"><div class="goal">' + esc(p.goal) + '</div>' +
          '<div class="badge">⏳ #' + p.id + "</div></div>" +
          '<div class="meta">' + TYPES[p.type] + " · " + (p.mode === "public" ? "Публично" : "Лично") + "</div>" +
          '<div class="meta">Видео записано. Без ' + p.stake + ' ⭐ карточка не публикуется.</div>' +
          '<button onclick="payPendingStake(' + p.id + "," + p.stake + ')">Оплатить ' + p.stake + " ⭐ и опубликовать</button>" +
          "</div>";
      }).join("");
    }
    if (bets.length) {
      html += '<div class="muted" style="margin-bottom:10px">' +
        (bets.length === 1 ? "Твоя активная ставка:" : "Твои активные ставки (" + bets.length + "):") + "</div>";
      html += bets.map(function (b) {
        const left = Math.max(0, b.duration_days - b.day_n);
        const pct = Math.max(2, Math.min(100, Math.round((b.day_n / b.duration_days) * 100)));
        // day_n может на 1 превысить duration_days в последний календарный день срока (пока
        // не отработал ночной cron-финал) — не показываем "День 4 из 3", выглядит как баг
        const dayLabel = b.day_n > b.duration_days ? (b.duration_days + " из " + b.duration_days + " (последний)") : (b.day_n + " из " + b.duration_days);
        const reportBadge = b.reported_today
          ? '<div class="badge" style="background:rgba(46,204,113,.15);color:#2ecc71;border-color:rgba(46,204,113,.35)">✓ Сегодня отчитался(-ась)</div>'
          : '<div class="badge" style="background:rgba(255,255,255,.06)">Ждём отчёт сегодня</div>';
        return '<div class="bet-card" onclick="openBet(' + b.id + ')">' +
          '<div class="top"><div class="goal">' + esc(b.goal) + '</div>' +
          '<div class="badge">#' + b.id + "</div></div>" +
          '<div class="meta">' + TYPES[b.type] + " · " + (b.mode === "public" ? "Публично" : "Лично") +
          " · День " + dayLabel + " · ещё " + left + " дн.</div>" +
          '<div class="meta">Персонаж: ' + (PERSONAS[b.persona] || "не выбран") + "</div>" +
          '<div style="margin-top:6px">' + reportBadge + '</div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
      }).join("");
    } else if (!pending.length) {
      html += '<div class="empty"><div style="font-size:17px;margin-bottom:4px">Активных ставок нет.</div>' +
        '<div class="muted">Готов проверить себя?</div></div>';
    }
    if (reviewing.length) {
      html += '<div class="muted" style="margin:20px 0 10px">Ждём проверки (' + reviewing.length + '):</div>';
      html += reviewing.map(function (r) {
        return '<div class="bet-card" style="border-style:dashed;cursor:default">' +
          '<div class="top"><div class="goal">' + esc(r.goal) + '</div>' +
          '<div class="badge">⏳ #' + r.id + "</div></div>" +
          '<div class="meta">' + TYPES[r.type] + " · " + (r.mode === "public" ? "Публично" : "Лично") + "</div>" +
          '<div class="meta">Срок вышел — проверяем финальный пруф, скоро сообщим результат.</div></div>';
      }).join("");
    }
    const challenges = ctx.challenges || [];
    if (challenges.length) {
      html += '<div class="muted" style="margin:20px 0 10px">⚔ Мои вызовы (' + challenges.length + '):</div>';
      html += challenges.map(function (c) {
        const oppLine = c.opponent
          ? 'Соперник: ' + esc(c.opponent.name) + (c.status === 'active' ? (c.opponent.reported_today ? ' · отчитался(-ась) сегодня ✓' : ' · ещё не отчитался(-ась) сегодня') : '')
          : 'Ждём соперника';
        return '<div class="bet-card" onclick="openChallengeDetail(' + c.id + ')">' +
          '<div class="top"><div class="goal">' + esc(c.goal) + '</div><div class="badge">⚔ #' + c.id + '</div></div>' +
          '<div class="meta">' + (TYPES[c.type] || c.type) + ' · ' + challengeStatusLabel(c) + '</div>' +
          '<div class="meta">' + oppLine + '</div></div>';
      }).join("");
    }
    html += '<button onclick="startWizard()">🚀 Дать слово</button>' + footerNav();
    app.innerHTML = html;
  };

  function challengeStatusLabel(c) {
    if (c.status === "proposed") return c.my_role === "creator" ? "ждём принятия соперником" : "ждёт решения";
    if (c.status === "active") return "День " + (c.day_n > c.duration_days ? c.duration_days + " из " + c.duration_days + " (последний)" : c.day_n + " из " + c.duration_days);
    if (c.status === "completed") return "завершён";
    if (c.status === "declined") return "отклонён";
    if (c.status === "cancelled") return "отменён";
    return c.status;
  }

  // ---------- карточка ставки: детали, отчёт, персонаж ----------
  window.openBet = function (id) {
    ctx.selectedBetId = id;
    renderBetDetail();
  };

  window.renderBetDetail = function () {
    const app = document.getElementById("app");
    const b = (ctx.bets || []).find(function (x) { return x.id === ctx.selectedBetId; });
    if (!b) { renderHome(); return; }
    const left = Math.max(0, b.duration_days - b.day_n);
    const personaGrid = Object.keys(PERSONAS).map(function (key) {
      const active = b.persona === key ? " active" : "";
      return '<div class="persona-opt' + active + '" onclick="setPersona(' + b.id + ',\'' + key + '\')">' +
        '<img src="' + PERSONA_IMG[key] + '" alt="' + PERSONAS[key] + '">' +
        '<div class="shade"></div>' +
        '<div class="p-name ' + PERSONA_FONT[key] + '">' + PERSONAS[key].replace(" 🔞", "") + "</div></div>";
    }).join("");
    const stakeLine = b.stake > 0
      ? (b.stake_paid ? b.stake + " ⭐ (оплачено)" : b.stake + " ⭐ (не оплачено)")
      : "твоё слово";
    app.innerHTML =
      '<div class="card"><div class="muted">Карточка #' + b.id + "</div>" +
      '<div class="big">' + esc(b.goal) + "</div>" +
      '<div class="row"><span>Тип</span><span>' + TYPES[b.type] + "</span></div>" +
      '<div class="row"><span>Режим</span><span>' + (b.mode === "public" ? "Публично" : "Лично") + "</span></div>" +
      '<div class="row"><span>День</span><span>' + (b.day_n > b.duration_days ? b.duration_days + " из " + b.duration_days + " (последний, ждём итог вечером)" : b.day_n + " из " + b.duration_days) + "</span></div>" +
      '<div class="row"><span>До финиша</span><span>' + left + " дн.</span></div>" +
      '<div class="row"><span>На кону</span><span>' + stakeLine + "</span></div>" +
      '<div class="row"><span>Отчёт сегодня</span><span>' + (b.reported_today ? "✓ отправлен" : "ещё нет") + "</span></div></div>" +
      (b.stake > 0 && !b.stake_paid ? '<button onclick="payStake(' + b.id + "," + b.stake + ')">Оплатить ' + b.stake + " ⭐</button>" : "") +
      (b.reported_today
        ? '<button class="btn-secondary" disabled style="opacity:.6">Отчёт за сегодня уже отправлен</button>'
        : '<button onclick="sendReport(' + b.id + ')">Отправить отчёт</button>') +
      '<div class="muted" style="margin-top:18px">Сменить персонажа:</div>' +
      '<div class="persona-grid">' + personaGrid + "</div>" +
      '<div id="bet-msg" class="muted" style="text-align:center;margin-top:10px"></div>' +
      '<div class="section-title">История отчётов</div>' +
      '<div id="bet-history" class="muted">Загрузка…</div>' +
      '<button class="btn-secondary" onclick="renderHome()">К списку ставок</button>';
    loadBetHistory(b.id);
  };

  // ---------- история отчётов по конкретной ставке — используется и обычной карточкой, и Вызовом,
  // чтобы клик по ставке в любом из виджетов профиля показывал не только статус, но и что реально
  // отправлялось по дням ----------
  async function loadBetHistory(betId, elId) {
    elId = elId || "bet-history";
    const el = document.getElementById(elId);
    if (!el || !betId) return;
    try {
      const r = await api("/bet-reports?bet_id=" + betId);
      const data = await r.json();
      if (!r.ok) { el.textContent = "Не удалось загрузить историю."; return; }
      const reports = data.reports || [];
      if (!reports.length) { el.textContent = "Пока нет отчётов."; return; }
      el.className = "";
      el.innerHTML = reports.map(function (rep) {
        const media = rep.has_photo ? " 📷" : "";
        const text = rep.content ? esc(rep.content) : "(без текста)";
        return '<div class="row" style="align-items:flex-start"><span>День ' + rep.day + ' · ' + formatRuDate(rep.date) + '</span>' +
          '<span style="text-align:right">' + text + media + '</span></div>';
      }).join("");
    } catch (e) {
      el.textContent = "Ошибка соединения.";
    }
  }
  window.loadBetHistory = loadBetHistory;

  window.sendReport = async function (betId) {
    const msgEl = document.getElementById("bet-msg");
    if (msgEl) msgEl.textContent = "Открываю чат…";
    try {
      const r = await api("/report", { method: "POST", body: JSON.stringify({ bet_id: betId }) });
      if (!r.ok) { if (msgEl) msgEl.textContent = "Не получилось. Попробуй ещё раз."; return; }
      closeApp();
    } catch (e) {
      if (msgEl) msgEl.textContent = "Ошибка соединения. Попробуй ещё раз.";
    }
  };

  window.payStake = async function (betId, stake) {
    const msgEl = document.getElementById("bet-msg");
    if (msgEl) msgEl.textContent = "Открываю оплату…";
    try {
      const r = await api("/invoice", { method: "POST", body: JSON.stringify({ bet_id: betId, stake: stake }) });
      const data = await r.json();
      if (!r.ok || !data.invoice_link) { if (msgEl) msgEl.textContent = "Не получилось создать оплату."; return; }
      if (!tg || typeof tg.openInvoice !== "function") { if (msgEl) msgEl.textContent = "Оплата недоступна в этой версии Telegram."; return; }
      tg.openInvoice(data.invoice_link, function (status) {
        if (status === "paid") {
          const b = (ctx.bets || []).find(function (x) { return x.id === betId; });
          if (b) b.stake_paid = true;
          renderBetDetail();
        } else {
          const el = document.getElementById("bet-msg");
          if (el) el.textContent = "Оплата не завершена.";
        }
      });
    } catch (e) {
      if (msgEl) msgEl.textContent = "Ошибка соединения.";
    }
  };

  // ждём, пока вебхук бота обработает successful_payment и переведёт ставку в active —
  // это отдельный апдейт от Telegram, приходит почти сразу, но не мгновенно
  async function pollUntilActive(betId, tries, delayMs) {
    for (let i = 0; i < tries; i++) {
      await new Promise(function (res) { setTimeout(res, delayMs); });
      await refreshStatus();
      if ((ctx.bets || []).some(function (b) { return b.id === betId; })) return true;
      if (!(ctx.pending || []).some(function (p) { return p.id === betId; })) return true; // ушла из pending — не наша забота как именно
    }
    return false;
  }

  window.payPendingStake = async function (betId, stake) {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Открываю оплату…");
    try {
      const r = await api("/invoice", { method: "POST", body: JSON.stringify({ bet_id: betId, stake: stake }) });
      const data = await r.json();
      if (!r.ok || !data.invoice_link) { await refreshStatus(); renderHome(); return; }
      if (!tg || typeof tg.openInvoice !== "function") { await refreshStatus(); renderHome(); return; }
      tg.openInvoice(data.invoice_link, async function (status) {
        if (status === "paid") {
          app.innerHTML = emptyMsg("Оплата прошла — публикую…");
          await pollUntilActive(betId, 8, 1200);
        } else {
          await refreshStatus();
        }
        renderHome();
      });
    } catch (e) {
      await refreshStatus();
      renderHome();
    }
  };

  window.setPersona = async function (betId, persona) {
    const msgEl = document.getElementById("bet-msg");
    if (msgEl) msgEl.textContent = "Сохраняю…";
    try {
      const r = await api("/persona", { method: "POST", body: JSON.stringify({ bet_id: betId, persona: persona }) });
      if (!r.ok) { if (msgEl) msgEl.textContent = "Не получилось сохранить."; return; }
      const b = (ctx.bets || []).find(function (x) { return x.id === betId; });
      if (b) b.persona = persona;
      renderBetDetail();
    } catch (e) {
      if (msgEl) msgEl.textContent = "Ошибка соединения.";
    }
  };

  // ---------- Вызов: карточка "моего" вызова, отчёт (переиспользует sendReport), корректировка условий ----------
  window.openChallengeDetail = async function (id) {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Загружаю…");
    await refreshChallenges();
    ctx.selectedChallengeId = id;
    drawChallengeMyDetail();
  };
  function drawChallengeMyDetail() {
    const app = document.getElementById("app");
    const c = (ctx.challenges || []).find(function (x) { return x.id === ctx.selectedChallengeId; });
    if (!c) { renderHome(); return; }
    const oppLine = c.opponent ? '<div class="row"><span>Соперник</span><span>' + esc(c.opponent.name) + '</span></div>' : "";
    const reportBtn = (c.status === "active" && c.my_bet_id) ? '<button onclick="sendReport(' + c.my_bet_id + ')">Отправить отчёт</button>' : "";
    const adjustBtn = (c.status === "proposed" && c.my_role && !c.pending_adjustment) ? '<button class="btn-secondary" onclick="showAdjustForm()">Предложить изменения</button>' : "";
    let adjBlock = "";
    if (c.pending_adjustment) {
      const a = c.pending_adjustment;
      if (a.proposed_by_me) {
        adjBlock = '<div class="card"><div class="muted">Ты предложил(а) изменить: ' + describeAdjustment(a) + '</div><div class="muted" style="margin-top:6px">Ждём ответа соперника.</div></div>';
      } else {
        adjBlock = '<div class="card"><div class="muted">Соперник предлагает изменить: ' + describeAdjustment(a) + '</div>' +
          '<div class="btn-row"><button onclick="respondAdjustment(' + a.id + ',true)">Согласиться</button>' +
          '<button class="btn-secondary" onclick="respondAdjustment(' + a.id + ',false)">Отклонить</button></div></div>';
      }
    }
    app.innerHTML =
      '<div class="card"><div class="muted">Вызов #' + c.id + '</div>' +
      '<div class="big">' + esc(c.goal) + '</div>' +
      '<div class="row"><span>Тип</span><span>' + (TYPES[c.type] || c.type) + '</span></div>' +
      '<div class="row"><span>Статус</span><span>' + challengeStatusLabel(c) + '</span></div>' +
      '<div class="row"><span>Старт</span><span>' + formatRuDate(c.start_date) + '</span></div>' +
      '<div class="row"><span>Срок</span><span>' + c.duration_days + ' дн.</span></div>' +
      '<div class="row"><span>Пруф</span><span>' + esc(c.proof_format || "") + '</span></div>' +
      '<div class="row"><span>Ставка</span><span>' + (c.stake ? c.stake + ' ⭐' : 'без ставки') + '</span></div>' +
      oppLine + '</div>' +
      adjBlock + reportBtn + adjustBtn +
      '<div id="adjust-form-holder"></div>' +
      '<div class="section-title">Твои отчёты</div>' +
      '<div id="bet-history" class="muted">Загрузка…</div>' +
      (c.opponent && c.opponent.bet_id
        ? '<div class="section-title">Отчёты соперника</div><div id="bet-history-opp" class="muted">Загрузка…</div>'
        : '') +
      '<button class="btn-secondary" onclick="renderHome()">К списку</button>';
    if (c.my_bet_id) loadBetHistory(c.my_bet_id);
    if (c.opponent && c.opponent.bet_id) loadBetHistory(c.opponent.bet_id, "bet-history-opp");
  }
  function describeAdjustment(a) {
    const parts = [];
    if (a.new_start_date) parts.push("старт " + formatRuDate(a.new_start_date));
    if (a.new_duration_days) parts.push(a.new_duration_days + " дн.");
    return parts.join(", ") || "условия";
  }
  window.showAdjustForm = function () {
    const holder = document.getElementById("adjust-form-holder");
    if (!holder) return;
    const min = new Date(Date.now() + 3 * 3600e3 + 864e5).toISOString().slice(0, 10);
    holder.innerHTML =
      '<div class="card"><div class="muted" style="margin-bottom:8px">Новая дата старта (необязательно):</div>' +
      '<input id="f-adj-date" type="date" min="' + min + '">' +
      '<div class="muted" style="margin:10px 0 8px">Новый срок в днях (необязательно):</div>' +
      '<input id="f-adj-days" type="text" inputmode="numeric" placeholder="Например: 45">' +
      '<div id="f-adj-err" class="err"></div>' +
      '<button onclick="proposeAdjustment()">Отправить предложение</button></div>';
  };
  window.proposeAdjustment = async function () {
    const c = (ctx.challenges || []).find(function (x) { return x.id === ctx.selectedChallengeId; });
    if (!c) return;
    const dateEl = document.getElementById("f-adj-date");
    const daysEl = document.getElementById("f-adj-days");
    const dateVal = dateEl ? dateEl.value : "";
    const daysVal = parseInt(daysEl ? daysEl.value : "", 10);
    if (!dateVal && !Number.isFinite(daysVal)) { const e = document.getElementById("f-adj-err"); if (e) e.textContent = "Укажи хотя бы одно изменение."; return; }
    try {
      const body = { challenge_id: c.id };
      if (dateVal) body.new_start_date = dateVal;
      if (Number.isFinite(daysVal)) body.new_duration_days = daysVal;
      const r = await api("/challenge-adjust-propose", { method: "POST", body: JSON.stringify(body) });
      if (!r.ok) { const e = document.getElementById("f-adj-err"); if (e) e.textContent = "Не получилось отправить."; return; }
      await refreshChallenges();
      drawChallengeMyDetail();
    } catch (e) {
      const el = document.getElementById("f-adj-err"); if (el) el.textContent = "Ошибка соединения.";
    }
  };
  window.respondAdjustment = async function (adjId, accept) {
    try {
      await api("/challenge-adjust-respond", { method: "POST", body: JSON.stringify({ adjustment_id: adjId, accept: accept }) });
    } catch (e) { /* молча */ }
    await refreshChallenges();
    drawChallengeMyDetail();
  };

  // ---------- Вызов: экран принятия приглашения (открывается по ?challenge=<token>) ----------
  window.renderChallengeInvite = async function (token) {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Загружаю вызов…");
    try {
      const r = await api("/challenge-invite?token=" + encodeURIComponent(token));
      const data = await r.json();
      if (!r.ok) {
        app.innerHTML = emptyMsg("Ссылка недействительна или уже использована.") + '<button class="btn-secondary" onclick="renderHome()">На главный экран</button>';
        return;
      }
      ctx.pendingChallenge = { token: token, data: data };
      drawChallengeInvite();
    } catch (e) {
      app.innerHTML = emptyMsg("Ошибка соединения.") + '<button class="btn-secondary" onclick="renderHome()">На главный экран</button>';
    }
  };
  function drawChallengeInvite() {
    const app = document.getElementById("app");
    const ch = ctx.pendingChallenge.data;
    // соперник должен увидеть видео-обещание создателя ДО того, как решит принимать вызов —
    // иначе решение принималось вслепую, по одному только тексту условий.
    const videoBlock = ch.creator_video_url
      ? '<div class="muted" style="margin-bottom:6px">Видео-обещание ' + esc(ch.creator_name) + ':</div>' +
        '<video src="' + escAttr(ch.creator_video_url) + '" controls playsinline style="width:100%;border-radius:12px;background:#000;margin-bottom:16px"></video>'
      : "";
    app.innerHTML =
      '<div class="card"><div class="muted">Вызов от ' + esc(ch.creator_name) + '</div>' +
      '<div class="big">' + esc(ch.goal) + '</div>' +
      '<div class="row"><span>Тип</span><span>' + (TYPES[ch.type] || ch.type) + '</span></div>' +
      '<div class="row"><span>Старт</span><span>' + formatRuDate(ch.start_date) + '</span></div>' +
      '<div class="row"><span>Срок</span><span>' + ch.duration_days + ' дн.</span></div>' +
      '<div class="row"><span>Пруф</span><span>' + esc(ch.proof_format) + '</span></div>' +
      '<div class="row"><span>Ставка</span><span>' + (ch.stake ? ch.stake + ' ⭐ с каждой стороны' : 'без ставки') + '</span></div></div>' +
      videoBlock +
      '<div class="muted" style="text-align:center;margin-bottom:16px">Условия менять нельзя на этом шаге — предложить правки можно будет после того, как оба согласятся.</div>' +
      '<button onclick="startChallengeAcceptVideo()">Принять вызов</button>' +
      '<button class="btn-secondary" onclick="declineChallengeInvite()">Отклонить</button>';
  }
  window.declineChallengeInvite = async function () {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Отклоняю…");
    try {
      await api("/challenge-decline", { method: "POST", body: JSON.stringify({ token: ctx.pendingChallenge.token }) });
    } catch (e) { /* молча */ }
    app.innerHTML = emptyMsg("Вызов отклонён.") + '<button class="btn-secondary" onclick="renderHome()">На главный экран</button>';
  };
  window.startChallengeAcceptVideo = function () {
    ctx.challengeAcceptDraft = { videoFile: null, videoPreviewUrl: null, cameraError: null };
    drawChallengeAcceptVideo();
  };
  function drawChallengeAcceptVideo() {
    const app = document.getElementById("app");
    const ch = ctx.pendingChallenge.data;
    const d = ctx.challengeAcceptDraft;
    const nameStr = (ctx.user && ctx.user.name) || "друг";
    const template = "Я, " + esc(nameStr) + ", принимаю вызов и даю слово, что " + esc(ch.goal) + ".";
    const templateBlock = '<div class="muted" style="margin-bottom:6px">Прочитай на камеру:</div><div class="card" style="font-weight:600;margin-bottom:10px">«' + template + '»</div>';
    let body;
    if (d.videoFile) {
      body = "<h2>Видео-обещание</h2>" + templateBlock +
        '<video src="' + d.videoPreviewUrl + '" controls playsinline style="width:100%;border-radius:12px;background:#000"></video>' +
        '<button class="btn-secondary" onclick="retakeChallengeVideo()">Переснять</button>' +
        '<div id="f-err" class="err"></div>';
    } else if (d.cameraError) {
      body = "<h2>Видео-обещание</h2>" + templateBlock +
        '<div class="empty">Камера недоступна: ' + esc(d.cameraError) + '<br>Можно прикрепить готовое видео.</div>' +
        '<input id="f-video" type="file" accept="video/*" onchange="handleChallengeVideoFile(this)">' +
        '<div id="f-err" class="err"></div>';
    } else {
      body = "<h2>Видео-обещание</h2>" + templateBlock +
        '<video id="camera-preview" autoplay muted playsinline style="width:100%;border-radius:12px;background:#000"></video>' +
        '<div id="rec-status" class="muted" style="text-align:center;margin-top:8px"></div>' +
        '<button id="rec-btn" onclick="toggleChallengeRecording()">Записать</button>' +
        '<div id="f-err" class="err"></div>';
    }
    app.innerHTML = body + '<div class="btn-row"><button class="btn-secondary" onclick="drawChallengeInvite()">Назад</button>' +
      (d.videoFile ? '<button onclick="submitChallengeAccept()">Принять вызов</button>' : "") + "</div>";
    stopCamera();
    if (!d.videoFile && !d.cameraError) startCamera(d, drawChallengeAcceptVideo);
  }
  window.handleChallengeVideoFile = function (input) {
    const f = input.files && input.files[0];
    if (!f) return;
    if (f.size > MAX_VIDEO_BYTES) { const e = document.getElementById("f-err"); if (e) e.textContent = "Видео слишком большое (максимум 20 МБ)."; input.value = ""; return; }
    const d = ctx.challengeAcceptDraft;
    if (d.videoPreviewUrl) URL.revokeObjectURL(d.videoPreviewUrl);
    d.videoFile = f; d.videoPreviewUrl = URL.createObjectURL(f);
    drawChallengeAcceptVideo();
  };
  window.retakeChallengeVideo = function () {
    const d = ctx.challengeAcceptDraft;
    if (d.videoPreviewUrl) URL.revokeObjectURL(d.videoPreviewUrl);
    d.videoFile = null; d.videoPreviewUrl = null; d.cameraError = null;
    drawChallengeAcceptVideo();
  };
  window.toggleChallengeRecording = function () {
    const btn = document.getElementById("rec-btn");
    const status = document.getElementById("rec-status");
    const d = ctx.challengeAcceptDraft;
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      if (!cameraStream) return;
      recordedChunks = [];
      const candidates = ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
      const mimeType = candidates.find(function (m) { return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); }) || "";
      try {
        mediaRecorder = mimeType ? new MediaRecorder(cameraStream, { mimeType: mimeType }) : new MediaRecorder(cameraStream);
      } catch (e) {
        const el = document.getElementById("f-err"); if (el) el.textContent = "Запись видео не поддерживается в этом Telegram-клиенте.";
        return;
      }
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = function () {
        if (recTimer) { clearInterval(recTimer); recTimer = null; }
        const blob = new Blob(recordedChunks, { type: mediaRecorder && mediaRecorder.mimeType || "video/webm" });
        if (blob.size === 0) { const el = document.getElementById("f-err"); if (el) el.textContent = "Не удалось записать видео. Попробуй ещё раз."; return; }
        if (blob.size > MAX_VIDEO_BYTES) { const el = document.getElementById("f-err"); if (el) el.textContent = "Видео получилось больше 20 МБ — запиши покороче."; return; }
        const ext = blob.type.indexOf("mp4") !== -1 ? "mp4" : "webm";
        if (d.videoPreviewUrl) URL.revokeObjectURL(d.videoPreviewUrl);
        d.videoFile = new File([blob], "oath." + ext, { type: blob.type });
        d.videoPreviewUrl = URL.createObjectURL(blob);
        stopCamera();
        drawChallengeAcceptVideo();
      };
      mediaRecorder.start();
      let secs = 0;
      if (status) status.textContent = "● Запись — 0:00";
      recTimer = setInterval(function () {
        secs++;
        if (status) status.textContent = "● Запись — " + Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
        if (secs >= 120 && mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
      }, 1000);
      if (btn) btn.textContent = "Стоп";
    } else {
      mediaRecorder.stop();
      if (btn) btn.textContent = "Записать";
    }
  };
  async function submitChallengeAccept() {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Принимаю вызов…");
    try {
      const d = ctx.challengeAcceptDraft;
      const fd = new FormData();
      fd.append("token", ctx.pendingChallenge.token);
      fd.append("video", d.videoFile, d.videoFile.name || "video.mp4");
      const r = await api("/challenge-accept", { method: "POST", body: fd });
      const data = await r.json();
      if (!r.ok) {
        app.innerHTML = emptyMsg("Не получилось (" + (data.error || "ошибка") + ").") + '<button class="btn-secondary" onclick="drawChallengeAcceptVideo()">Назад</button>';
        return;
      }
      if (data.pending) { openStakeInvoice(data.invoice_link, data.bet_id, "challengeAccept"); }
      else { finishChallengeAccept(false); }
    } catch (e) {
      app.innerHTML = emptyMsg("Ошибка соединения.") + '<button class="btn-secondary" onclick="drawChallengeAcceptVideo()">Назад</button>';

  window.pick = function (key, val) { ctx.draft[key] = val; wizNext(); };
  window.pickKind = function (v) {

  window.pickChallengeStart = function (daysAhead) {

  };
  window.pickChallengeStartDate = function (v) {
    ctx.draft.challenge_start_date = v;

  window.pickProofFormat = function (v) { ctx.draft.proof_format = v; renderWizard(); };
  function renderInviteeResults() {

    }).join("");

  let inviteSearchTimer = null;
  window.searchInvitee = function (v) {

    inviteSearchTimer = setTimeout(async function () {

        const data = await r.json();
        ctx.draft._inviteResults = (r.ok && data.users) ? data.users : [];
      } catch (e) { ctx.draft._inviteResults = []; }
      const box = document.getElementById("invitee-results");
      if (box) box.innerHTML = renderInviteeResults();
    }, 300);
  };
  window.pickInvitee = function (id, label) {

  window.pickDays = function (n) {

  window.pickDate = function (v) {
    const fromStr = (ctx.draft.kind === "challenge" && ctx.draft.challenge_start_date)
      ? ctx.draft.challenge_start_date
      : new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);
    const from = new Date(fromStr + "T00:00:00Z");
    const to = new Date(v + "T00:00:00Z");
    const days = Math.round((to - from) / 864e5);
    ctx.draft.days = days; ctx.draft._date = v;
    renderWizard();
  };
  window.moreExamples = function () {

  window.pickHabitTier = function (v) {

  window.handleVideoFile = function (input) {
    const f = input.files && input.files[0];
    if (!f) return;
    if (f.size > MAX_VIDEO_BYTES) { err("Видео слишком большое (максимум 20 МБ) — выбери покороче или в меньшем качестве."); input.value = ""; return; }
    if (ctx.draft.videoPreviewUrl) URL.revokeObjectURL(ctx.draft.videoPreviewUrl);
    ctx.draft.videoFile = f;
    ctx.draft.videoPreviewUrl = URL.createObjectURL(f);
    renderWizard();

  // ---------- живая запись видео (getUserMedia + MediaRecorder) ----------
  // По умолчанию — только камера, без выбора старого файла из галереи: это единственный
  // способ подтвердить, что обещание даётся "здесь и сейчас", а не переиспользуется старое видео.
  // Файловый пикер — лишь запасной путь, если браузер/клиент не даёт доступ к камере.
  let cameraStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recTimer = null;

  function stopCamera() {
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
    if (mediaRecorder && mediaRecorder.state === "recording") { try { mediaRecorder.stop(); } catch (e) {} }
    mediaRecorder = null;
    if (cameraStream) {
      cameraStream.getTracks().forEach(function (t) { t.stop(); });
      cameraStream = null;
    }
  }

  // targetDraft/rerender — обобщено, чтобы этой же камерой пользовался и мастер соло-ставки
  // (ctx.draft + renderWizard), и экран принятия Вызова (ctx.challengeAcceptDraft + drawChallengeAcceptVideo)
  async function startCamera(targetDraft, rerender) {
    const videoEl = document.getElementById("camera-preview");
    if (!videoEl || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      targetDraft.cameraError = "не поддерживается этим браузером";
      rerender();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
      cameraStream = stream;
      videoEl.srcObject = stream;
    } catch (e) {
      targetDraft.cameraError = (e && e.message) ? e.message : "нет доступа к камере";
      rerender();
    }
  }

  window.toggleRecording = function () {
    const btn = document.getElementById("rec-btn");
    const status = document.getElementById("rec-status");
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      if (!cameraStream) return;
      recordedChunks = [];
      const candidates = ["video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
      const mimeType = candidates.find(function (m) {
        return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m);
      }) || "";
      try {
        mediaRecorder = mimeType ? new MediaRecorder(cameraStream, { mimeType: mimeType }) : new MediaRecorder(cameraStream);
      } catch (e) {
        err("Запись видео не поддерживается в этом Telegram-клиенте.");
        return;
      }
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = function () {
        if (recTimer) { clearInterval(recTimer); recTimer = null; }
        const blob = new Blob(recordedChunks, { type: mediaRecorder && mediaRecorder.mimeType || "video/webm" });
        if (blob.size === 0) { err("Не удалось записать видео. Попробуй ещё раз."); return; }
        if (blob.size > MAX_VIDEO_BYTES) { err("Видео получилось больше 20 МБ — запиши покороче."); return; }
        const ext = blob.type.indexOf("mp4") !== -1 ? "mp4" : "webm";
        if (ctx.draft.videoPreviewUrl) URL.revokeObjectURL(ctx.draft.videoPreviewUrl);
        ctx.draft.videoFile = new File([blob], "oath." + ext, { type: blob.type });
        ctx.draft.videoPreviewUrl = URL.createObjectURL(blob);
        stopCamera();
        renderWizard();
      };
      mediaRecorder.start();
      let secs = 0;
      if (status) status.textContent = "● Запись — 0:00";
      recTimer = setInterval(function () {
        secs++;
        if (status) status.textContent = "● Запись — " + Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
        if (secs >= 120 && mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
      }, 1000);
      if (btn) btn.textContent = "Стоп";
    } else {
      mediaRecorder.stop();
      if (btn) btn.textContent = "Записать";
    }
  };

  window.retakeVideo = function () {
    if (ctx.draft.videoPreviewUrl) { URL.revokeObjectURL(ctx.draft.videoPreviewUrl); }
    ctx.draft.videoFile = null;
    ctx.draft.videoPreviewUrl = null;

  window.pickStake = function (n) {

    if (input) input.value = n || "";
    const note = document.getElementById("stake-note");

  };
  window.onStakeInput = function (v) {
    const n = parseInt(v, 10);
    ctx.draft.stake = Number.isFinite(n) && n > 0 ? Math.min(n, 10000) : 0;
    const note = document.getElementById("stake-note");
    if (note) note.textContent = ctx.draft.stake ? ctx.draft.stake + " ⭐ будет списано при подтверждении." : "Пока без ставки — только слово.";
  };

  function err(msg) { const e = document.getElementById("f-err"); if (e) e.textContent = msg; }

  window.wizBack = function () { ctx.step--; renderWizard(); };

  window.wizNext = async function () {
    const d = ctx.draft;
    const name = curName();
    if (name === "kind" && !d.kind) return err("Выбери вариант.");
    if (name === "mode" && !d.mode) return err("Выбери вариант.");
    if (name === "type" && !d.type) return err("Выбери вариант.");
    if (name === "startDate" && !d.challenge_start_date) return err("Выбери дату старта.");
    if (name === "proofFormat" && !d.proof_format) return err("Выбери формат пруфа.");
    if (name === "invitee") {
      const v = document.getElementById("f-invitee").value.trim();
      if (v.length < 2) return err("Укажи, кого вызываешь.");
      d.invitee_label = v;
    }
    if (name === "goal") {
      const v = document.getElementById("f-goal").value.trim();
      if (!v) return err("Напиши цель.");
      // цифра/дата — это подсказка, а не обязаловка: не блокируем переход, просто напоминаем
      if (d.type !== "quit" && !/\d/.test(v)) err("Совет: цифра или дата помогает понять, что ты дошёл — но не обязательна.");
      d.goal = v;
    }
    if (name === "pointA") {
      const v = document.getElementById("f-a").value.trim();
      if (!v) return err("Опиши, где ты сейчас.");
      d.point_a = v;
    }
    if (name === "motivation") {
      const v = document.getElementById("f-mot").value.trim();
      if (!v) return err("Напиши коротко — для чего.");
      d.motivation = v;
    }
    if (name === "duration") {
      if (!d.days || d.days < 1 || d.days > 365) return err("Выбери срок.");
      if (d.type === "habit" && d.days < 21) return err("Для привычки нужно минимум 21 день.");
      if (d.type === "quit" && d.days < 30) return err("Для отказа нужен срок минимум 30 дней.");
    }
    if (name === "skipDays") {
      if (!d.allowed_skip_weekdays || !d.allowed_skip_weekdays.length) return err("Выбери хотя бы один день.");
    }
    if (name === "witness") {
      const phone = document.getElementById("f-wphone").value.trim();
      const wtg = document.getElementById("f-wtg").value.trim();
      if (!wtg) return err("Напиши имя или Telegram свидетеля.");
      d.witness_phone = phone || null; d.witness_tg = wtg;
    }
    if (name === "video") {
      if (!d.videoFile) return err("Прикрепи видео — без него слово не считается.");
    }
    if (name === "review") { return d.kind === "challenge" ? submitCreateChallenge() : submitCreate(); }
    ctx.step++;
    renderWizard();
  };

  async function submitCreateChallenge() {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Отправляю вызов…");
    try {
      const d = ctx.draft;
      const fd = new FormData();
      const draftPayload = {
        type: d.type, goal: d.goal, duration_days: d.days, start_date: d.challenge_start_date,
        proof_format: d.proof_format, invitee: d.invitee_label, invitee_user_id: d.invitee_user_id || null, stake: d.stake || 0,
      };
      if (d.type === "result") { draftPayload.point_a = d.point_a; draftPayload.motivation = d.motivation; }
      if (d.type === "habit") { draftPayload.habit_tier = d.habit_tier; draftPayload.skip_mode = d.skip_mode; draftPayload.allowed_skip_weekdays = d.allowed_skip_weekdays || []; }
      fd.append("draft", JSON.stringify(draftPayload));
      fd.append("video", d.videoFile, d.videoFile.name || "video.mp4");
      const r = await api("/challenge-create", { method: "POST", body: fd });
      const data = await r.json();
      if (!r.ok) {
        app.innerHTML = emptyMsg("Не получилось (" + (data.error || "ошибка") + "). Вернись и попробуй снова.") +
          '<button onclick="renderWizard()">Назад к форме</button>';
        return;
      }
      ctx.lastChallengeInvite = data.invite || null;
      if (data.pending) { openStakeInvoice(data.invoice_link, data.bet_id, "challenge"); }
      else { finishChallengeCreate(false); }
    } catch (e) {
      app.innerHTML = emptyMsg("Ошибка соединения. Попробуй ещё раз.") + '<button onclick="renderWizard()">Назад к форме</button>';
    }
  }

  function finishChallengeCreate(paid) {
    const app = document.getElementById("app");
    const inv = ctx.lastChallengeInvite;
    const inviteBlock = inv
      ? '<div class="card" style="text-align:center"><div class="muted" style="margin-bottom:8px">Нажми «Поделиться» и выбери соперника прямо из своих контактов в Telegram — или перешли ссылку/QR вручную:</div>' +
        '<img src="' + escAttr(inv.qr) + '" alt="QR" style="width:160px;height:160px;border-radius:12px;margin-bottom:8px">' +
        '<div style="word-break:break-all;font-size:13px;color:var(--gold2);margin-bottom:10px">' + esc(inv.link) + "</div>" +
        '<div style="display:flex;gap:8px"><button class="btn-secondary" style="flex:1;margin:0" onclick="shareChallengeInvite()">Поделиться</button>' +
        '<button class="btn-secondary" style="flex:1;margin:0" onclick="copyChallengeInvite(this)">Скопировать</button></div></div>'
      : "";
    const note = paid
      ? '<div class="muted" style="text-align:center;margin-bottom:12px">⭐ Твоя ставка оплачена. Ждём, пока соперник примет и тоже поставит на кон.</div>'
      : '<div class="muted" style="text-align:center;margin-bottom:12px">Ждём, пока соперник примет вызов.</div>';
    app.innerHTML =

  window.shareChallengeInvite = function () {
    const inv = ctx.lastChallengeInvite;
    if (!inv) return;
    const shareUrl = "https://t.me/share/url?url=" + encodeURIComponent(inv.link) + "&text=" + encodeURIComponent("Вызываю тебя в Сила Слова");
    if (tg && typeof tg.openTelegramLink === "function") tg.openTelegramLink(shareUrl);
    else window.open(shareUrl, "_blank");
  };
  window.copyChallengeInvite = async function (btn) {
    const inv = ctx.lastChallengeInvite;
    if (!inv) return;
    try {
      await navigator.clipboard.writeText(inv.link);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = inv.link; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    }
    if (btn) { const prev = btn.textContent; btn.textContent = "Скопировано ✓"; setTimeout(() => { btn.textContent = prev; }, 1500); }
  };

  async function submitCreate() {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Публикую слово…");
    try {
      const d = ctx.draft;
      const fd = new FormData();
      const draftPayload = { mode: d.mode, type: d.type, goal: d.goal, days: d.days, stake: d.stake || 0 };
      if (d.type === "result") {
        draftPayload.point_a = d.point_a;
        draftPayload.motivation = d.motivation;
      }
      if (d.type === "habit") {
        draftPayload.habit_tier = d.habit_tier;
        draftPayload.skip_mode = d.skip_mode;
        draftPayload.allowed_skip_weekdays = d.allowed_skip_weekdays || [];
      }
      if (d.type === "quit") {
        draftPayload.witness_phone = d.witness_phone;
        draftPayload.witness_tg = d.witness_tg;
        draftPayload.witness_checkin_time = d.witness_checkin_time;
      }
      fd.append("draft", JSON.stringify(draftPayload));
      fd.append("video", d.videoFile, d.videoFile.name || "video.mp4");
      const r = await api("/create", { method: "POST", body: fd });
      const data = await r.json();
      if (!r.ok) {
        app.innerHTML = emptyMsg("Не получилось (" + (data.error || "ошибка") + "). Вернись и попробуй снова.") +
          '<button onclick="renderWizard()">Назад к форме</button>';
        return;
      }
      ctx.lastWitnessInvite = data.witness_invite || null;
      if (data.pending) { openStakeInvoice(data.invoice_link, data.bet_id); }
      else { await refreshStatus(); finishWizard(data.bet_id, true, null); }
    } catch (e) {
      app.innerHTML = emptyMsg("Ошибка соединения. Попробуй ещё раз.") + '<button onclick="renderWizard()">Назад к форме</button>';
    }
  }

  // ставка > 0: карточка ЕЩЁ НЕ существует для остальных — она публикуется только после
  // того, как звёзды реально списаны (подтверждение приходит на вебхук бота отдельным
  // апдейтом, поэтому после tg.openInvoice() дожидаемся, пока ставка станет active).
  window.openStakeInvoice = function (link, betId, kind) {
    kind = kind || "solo"; // 'solo' | 'challenge' (создатель) | 'challengeAccept' (приглашённый)
    const app = document.getElementById("app");
    if (!link) {
      app.innerHTML = emptyMsg("Не удалось создать оплату. Ставка сохранена как «ждёт оплаты» — попробуй ещё раз из списка ставок.") +
        '<button class="btn-secondary" onclick="reloadAndHome()">К списку ставок</button>';
      return;
    }
    app.innerHTML = emptyMsg("Открываю оплату…");
    if (!tg || typeof tg.openInvoice !== "function") {
      app.innerHTML = emptyMsg("Оплата недоступна в этой версии Telegram. Ставка сохранена как «ждёт оплаты».") +
        '<button class="btn-secondary" onclick="reloadAndHome()">К списку ставок</button>';
      return;
    }
    tg.openInvoice(link, async function (status) {
      if (status === "paid") {
        if (kind === "solo") {
          app.innerHTML = emptyMsg("Оплата прошла — публикую карточку…");
          const ok = await pollUntilActive(betId, 8, 1200);
          finishWizard(betId, true, ok ? "active" : "processing");
        } else if (kind === "challenge") {
          finishChallengeCreate(true);
        } else if (kind === "challengeAccept") {
          finishChallengeAccept(true);
        }
      } else {
        if (kind === "solo") finishWizard(betId, false, status);
        else if (kind === "challenge") finishChallengeCreate(false);
        else if (kind === "challengeAccept") finishChallengeAccept(false);
      }
    });
  };

  function finishWizard(betId, paid, status) {
    const app = document.getElementById("app");
    if (!paid) {
      app.innerHTML =
        '<div class="card" style="text-align:center"><div style="font-size:40px;margin-bottom:8px">⏳</div>' +
        '<div style="font-size:17px;margin-bottom:6px">Видео записано, но не опубликовано</div>' +
        '<div class="muted">Оплата не завершена — карточка #' + betId + " появится, как только оплатишь ставку. Она ждёт тебя в списке ставок." + "</div></div>" +
        '<button class="btn-secondary" onclick="reloadAndHome()">К списку ставок</button>';
      return;
    }
    const note = status === "processing"
      ? '<div class="muted" style="text-align:center;margin-bottom:12px">⭐ Оплата подтверждается — карточка появится в группе в течение минуты.</div>'
      : '<div class="muted" style="text-align:center;margin-bottom:12px">⭐ Ставка оплачена.</div>';
    const wi = ctx.lastWitnessInvite;
    const witnessBlock = wi
      ? '<div class="card" style="text-align:center"><div class="muted" style="margin-bottom:8px">Нажми «Поделиться» и выбери свидетеля прямо из своих контактов в Telegram — или перешли ссылку/QR вручную:</div>' +
        '<img src="' + escAttr(wi.qr) + '" alt="QR" style="width:160px;height:160px;border-radius:12px;margin-bottom:8px">' +
        '<div style="word-break:break-all;font-size:13px;color:var(--gold2);margin-bottom:10px">' + esc(wi.link) + "</div>" +
        '<div style="display:flex;gap:8px"><button class="btn-secondary" style="flex:1;margin:0" onclick="shareWitnessLink()">Поделиться</button>' +
        '<button class="btn-secondary" style="flex:1;margin:0" onclick="copyWitnessLink(this)">Скопировать</button></div></div>'
      : "";
    app.innerHTML =
      '<div class="card" style="text-align:center"><div style="font-size:40px;margin-bottom:8px">🎬</div>' +
      '<div style="font-size:17px;margin-bottom:6px">Слово дано</div>' +
      '<div class="muted">Карточка #' + betId + " создана" + (ctx.draft.mode === "public" ? " и опубликована в группе." : ".") + "</div></div>" +
      note + witnessBlock +
      '<button onclick="goToPersonaAfterCreate(' + betId + ')">Выбрать персонажа</button>' +
      '<button class="btn-secondary" onclick="reloadAndHome()">К списку ставок</button>';
  }

  // ---------- шаринг ссылки-приглашения свидетелю: раньше её можно было только скриншотить ----------
  window.shareWitnessLink = function () {
    const wi = ctx.lastWitnessInvite;
    if (!wi) return;
    const shareUrl = "https://t.me/share/url?url=" + encodeURIComponent(wi.link) +
      "&text=" + encodeURIComponent("Будь моим свидетелем в Сила Слова");
    if (tg && typeof tg.openTelegramLink === "function") tg.openTelegramLink(shareUrl);
    else window.open(shareUrl, "_blank");
  };
  window.copyWitnessLink = async function (btn) {
    const wi = ctx.lastWitnessInvite;
    if (!wi) return;
    try {
      await navigator.clipboard.writeText(wi.link);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = wi.link; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    }
    if (btn) { const prev = btn.textContent; btn.textContent = "Скопировано ✓"; setTimeout(() => { btn.textContent = prev; }, 1500); }
  };

  window.goToPersonaAfterCreate = async function (betId) {
    await refreshStatus();
    ctx.selectedBetId = betId;
    renderBetDetail();
  };
  window.reloadAndHome = async function () {
    await refreshStatus();
    renderHome();
  };

  // ---------- профиль игрока ----------
  const MEDAL_LOCKED_ICON = "🔒";
  const XP_PER_LEVEL_CLIENT = 300; // держим в синхроне со значением на бэкенде — только для рисования полоски

  window.renderProfile = async function () {
    const app = document.getElementById("app");
    app.innerHTML = emptyMsg("Загружаю профиль…");
    try {
      const r = await api("/profile");
      const data = await r.json();
      if (!r.ok) { app.innerHTML = emptyMsg("Не удалось загрузить профиль.") + '<button class="btn-secondary" onclick="renderHome()">Назад</button>'; return; }
      ctx.profile = data;
      drawProfile();
    } catch (e) {
      app.innerHTML = emptyMsg("Ошибка соединения.") + '<button class="btn-secondary" onclick="renderHome()">Назад</button>';
    }
  };

  function challengeSection(cs) {
    cs = cs || { total: 0, active: 0, kept: 0, failed: 0 };
    if (!cs.total) {
      return '<div class="section-title">⚔ Вызовы</div>' +
        '<div class="muted" style="margin-bottom:8px">Пока ни одного вызова — позови кого-нибудь на одинаковых условиях.</div>' +
        '<button class="btn-secondary" onclick="renderHome()">К вызовам</button>';
    }
    const items = [[cs.total, "всего"], [cs.active, "сейчас идёт"], [cs.kept, "сдержано"], [cs.failed, "не сдержано"]];
    const grid = items.map(function (s) {
      return '<div class="stat-box"><div class="num">' + s[0] + '</div><div class="lbl">' + s[1] + "</div></div>";
    }).join("");
    return '<div class="section-title">⚔ Вызовы</div>' +
      '<div class="stat-grid">' + grid + "</div>" +
      '<button class="btn-secondary" style="margin-top:8px" onclick="renderHome()">К вызовам</button>';
  }

  function publicSection(ps) {
    ps = ps || { total: 0, active: 0, kept: 0, failed: 0 };
    if (!ps.total) {
      return '<div class="section-title">📣 Публичные ставки</div>' +
        '<div class="muted" style="margin-bottom:8px">Пока ни одной публичной ставки — заяви о цели на людях.</div>' +
        '<button class="btn-secondary" onclick="renderHome()">К ставкам</button>';
    }
    const items = [[ps.total, "всего"], [ps.active, "сейчас идёт"], [ps.kept, "сдержано"], [ps.failed, "не сдержано"]];
    const grid = items.map(function (s) {
      return '<div class="stat-box"><div class="num">' + s[0] + '</div><div class="lbl">' + s[1] + "</div></div>";
    }).join("");
    return '<div class="section-title">📣 Публичные ставки</div>' +
      '<div class="stat-grid">' + grid + "</div>" +
      '<button class="btn-secondary" style="margin-top:8px" onclick="renderHome()">К ставкам</button>';
  }

  function drawProfile() {
    const app = document.getElementById("app");
    const p = ctx.profile;
    const u = p.user;
    const initial = (u.name || "?").trim().charAt(0).toUpperCase();
    const avatarInner = u.avatar_url
      ? '<img src="' + escAttr(u.avatar_url) + '" alt="">'
      : initial;

    const trustPct = Math.max(0, Math.min(100, p.trust_level));
    const drivePct = Math.max(0, Math.min(100, p.drive_level * 20));
    const xpInLevel = p.xp % XP_PER_LEVEL_CLIENT;
    const xpPct = Math.max(2, Math.min(100, Math.round((xpInLevel / XP_PER_LEVEL_CLIENT) * 100)));

    const stats = p.stats || {};
    const statItems = [
      [stats.total, "ставок всего"], [stats.kept, "сдержано"], [stats.failed, "не сдержано"],
      [stats.active, "сейчас активно"], [stats.public, "публичных"],
      [stats.best_streak, "лучшая серия"], [stats.current_streak, "текущая серия"],
    ];
    const statGrid = statItems.map(function (s) {
      return '<div class="stat-box"><div class="num">' + (s[0] ?? 0) + '</div><div class="lbl">' + s[1] + "</div></div>";
    }).join("");

    const bonds = (p.persona_bonds || []).slice().sort(function (a, b) { return b.bond_xp - a.bond_xp; });
    const bondRows = bonds.length
      ? bonds.map(function (b) {
          const img = PERSONA_IMG[b.persona] || "";
          const label = (PERSONAS[b.persona] || b.persona).replace(" 🔞", "");
          return '<div class="bond-row">' + (img ? '<img src="' + img + '" alt="">' : "") +
            '<div class="bname">' + esc(label) + '</div><div class="blvl">Ур. ' + b.bond_level + " · " + b.bond_xp + " XP</div></div>";
        }).join("")
      : '<div class="muted">Пока нет сопровождения — персонаж появится после первого отчёта.</div>';

    const earned = (p.medals_earned || []).map(function (m) {
      return '<div class="medal"><span class="micon">' + esc(m.icon || "🏅") + '</span>' + esc(m.name) + "</div>";
    }).join("");
    const locked = (p.medals_locked || []).map(function (m) {
      return '<div class="medal locked"><span class="micon">' + MEDAL_LOCKED_ICON + '</span>' + esc(m.name) + "</div>";
    }).join("");
    const hiddenNote = p.medals_hidden_count
      ? '<div class="muted" style="margin-top:8px">+' + p.medals_hidden_count + " скрытых медалей — условия неизвестны.</div>"
      : "";

    const hardest = p.hardest_bet
      ? '<div class="card hardest-card"><div class="hicon">🏔️</div><div>' +
        '<div class="muted" style="font-size:12px">Самая сложная сдержанная ставка</div>' +
        '<div style="font-weight:600">' + esc(p.hardest_bet.goal) + "</div>" +
        '<div class="muted" style="font-size:12px">' + (p.hardest_bet.stake ? p.hardest_bet.stake + " ⭐ · " : "") + p.hardest_bet.duration_days + " дн.</div>" +
        "</div></div>"
      : "";

    app.innerHTML =
      '<input id="avatar-file" type="file" accept="image/*" style="display:none" onchange="handleAvatarFile(this)">' +
      '<div class="profile-header">' +
      '<div class="avatar-wrap" onclick="triggerAvatarUpload()">' + avatarInner + '<div class="avatar-edit">сменить</div></div>' +
      "<div><div class=\"profile-name\">" + esc(u.name) + "</div>" +
      '<div class="level-badge">Уровень ' + p.level + "</div></div></div>" +

      '<div class="bar-label"><span>Trust</span><b>' + trustPct + "%</b></div>" +
      '<div class="bar-track"><div class="bar-fill trust" style="width:' + trustPct + '%"></div></div>' +
      '<div class="bar-label"><span>Drive</span><b>Ур. ' + p.drive_level + " · " + p.drive_recent_bets + " за 30 дн.</b></div>" +
      '<div class="bar-track"><div class="bar-fill drive" style="width:' + drivePct + '%"></div></div>' +
      '<div class="bar-label"><span>Опыт</span><b>' + p.xp + " XP · до след. уровня " + p.xp_to_next + "</b></div>" +
      '<div class="bar-track"><div class="bar-fill xp" style="width:' + xpPct + '%"></div></div>' +

      hardest +

      '<div class="section-title">Статистика</div>' +
      '<div class="stat-grid">' + statGrid + "</div>" +

      challengeSection(p.challenge_stats) +
      publicSection(p.public_stats) +

      '<div class="section-title">Персонажи</div>' +
      bondRows +

      '<div class="section-title">Медали</div>' +
      '<div class="medal-shelf">' + earned + locked + "</div>" +
      hiddenNote +

      '<button class="btn-secondary" onclick="renderHome()" style="margin-top:20px">К списку ставок</button>';
  }

  window.triggerAvatarUpload = function () {
    const el = document.getElementById("avatar-file");
    if (el) el.click();
  };

  window.handleAvatarFile = async function (input) {
    const f = input.files && input.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { alert("Фото слишком большое — максимум 5 МБ."); input.value = ""; return; }
    try {
      const fd = new FormData();
      fd.append("photo", f, f.name || "avatar.jpg");
      const r = await api("/avatar", { method: "POST", body: fd });
      const data = await r.json();
      if (r.ok && data.avatar_url) {
        ctx.profile.user.avatar_url = data.avatar_url;
        ctx.profile.user.avatar_source = "custom";
        drawProfile();
      } else {
        alert("Не получилось загрузить фото. Попробуй ещё раз.");
      }
    } catch (e) {
      alert("Ошибка соединения. Попробуй ещё раз.");
    }
  };

  boot();
</script>
</body>
</html>
