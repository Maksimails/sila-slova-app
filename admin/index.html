<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Админка · Сила Слова</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #08090b; --panel: #131418; --panel2: #17181c; --ink: #f5f5f7; --muted: #8a8d97;
    --gold: #e8b04b; --gold-deep: #b8790f; --crimson: #e14b3f; --teal: #2fb587; --line: #212228;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--dark); color: var(--ink); font-family: 'Manrope', -apple-system, sans-serif; }
  a { color: inherit; }
  input, button { font-family: inherit; }

  /* ---------- gate ---------- */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-card { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; text-align: center; }
  .gate-card h1 { font-size: 18px; margin: 0 0 6px; }
  .gate-card p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .gate-card input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #0e0f13; color: var(--ink); font-size: 14px; margin-bottom: 12px; }
  .gate-card button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--gold), #cc9530); color: #1a1200; font-weight: 800; font-size: 14.5px; cursor: pointer; }
  .gate-err { color: var(--crimson); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  /* ---------- app shell ---------- */
  #app { display: none; padding: 20px 20px 60px; max-width: 1180px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 19px; margin: 0; font-weight: 800; }
  .topbar .meta { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 10px; }
  .refresh-btn { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .refresh-btn:hover { border-color: var(--gold); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); display: inline-block; box-shadow: 0 0 6px var(--teal); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .card .v { font-size: 22px; font-weight: 800; }
  .card .l { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
  .card .v.gold { color: var(--gold); } .card .v.red { color: var(--crimson); } .card .v.teal { color: var(--teal); }

  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13.5px; }
  .toolbar select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 14px; overflow: hidden; font-size: 13.5px; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
  thead th:hover { color: var(--ink); }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr:last-child td { border-bottom: none; }
  .user-cell { display: flex; align-items: center; gap: 9px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #26272d; object-fit: cover; flex-shrink: 0; }
  .avatar.ph { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--muted); }
  .uname { font-weight: 700; font-size: 13.5px; }
  .uhandle { color: var(--muted); font-size: 11.5px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
  .badge.active { background: rgba(47,181,135,.15); color: var(--teal); }
  .badge.cooling { background: rgba(232,176,75,.15); color: var(--gold); }
  .badge.dormant { background: rgba(225,75,63,.15); color: var(--crimson); }
  .badge.new { background: rgba(140,150,255,.15); color: #9aa3ff; }
  .risk { color: var(--crimson); font-size: 11px; font-weight: 700; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- detail drawer ---------- */
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 90; }
  #drawer { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel); z-index: 91;
    overflow-y: auto; border-left: 1px solid var(--line); padding: 22px; }
  #drawer .close { position: absolute; top: 18px; right: 18px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .d-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .d-head .avatar { width: 52px; height: 52px; font-size: 18px; }
  .d-head h2 { margin: 0; font-size: 17px; }
  .d-head .uhandle { font-size: 12.5px; }
  .d-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .d-stat { background: var(--panel2); border-radius: 10px; padding: 10px; text-align: center; }
  .d-stat b { display: block; font-size: 16px; }
  .d-stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
  .d-section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  .d-bet { background: var(--panel2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .d-bet .row1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .d-bet .row2 { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .d-empty { color: var(--muted); font-size: 12.5px; padding: 10px 0; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>⚔️ Админка</h1>
    <p>Сила Слова — только для своих</p>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="off" />
    <button onclick="tryLogin()">Войти</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>⚔️ Сила Слова — Админка</h1>
    <div class="meta"><span class="live-dot"></span> <span id="lastUpdated">—</span> <button class="refresh-btn" onclick="loadAll(true)">Обновить</button></div>
  </div>

  <div class="cards" id="cards"><div class="loading">Загрузка…</div></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Поиск по имени или @username…" oninput="renderUsers()" />
    <select id="statusFilter" onchange="renderUsers()">
      <option value="">Все статусы</option>
      <option value="active">Активны</option>
      <option value="cooling">Остывают</option>
      <option value="dormant">Спят</option>
      <option value="new">Новые</option>
    </select>
  </div>

  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th onclick="setSort('name')">Пользователь</th>
          <th onclick="setSort('status')">Статус</th>
          <th onclick="setSort('trust_level')">Доверие</th>
          <th onclick="setSort('current_streak')">Серия</th>
          <th onclick="setSort('bets_active')">Ставки</th>
          <th onclick="setSort('stake_paid_total')">⭐ Всего</th>
          <th onclick="setSort('last_activity_at')">Активность</th>
        </tr>
      </thead>
      <tbody id="usersBody"><tr><td colspan="7" class="loading">Загрузка…</td></tr></tbody>
    </table>
  </div>
</div>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <button class="close" onclick="closeDrawer()">✕</button>
  <div id="drawerBody"><div class="loading">Загрузка…</div></div>
</div>

<script>
  const API = "https://mparfxpddlkfuixminnx.supabase.co/functions/v1/admin";
  let ADMIN_KEY = localStorage.getItem("sila_admin_key") || "";
  let allUsers = [];
  let sortKey = "last_activity_at";
  let sortDir = -1;
  let refreshTimer = null;

  async function api(path) {
    const r = await fetch(API + path, { headers: { "X-Admin-Key": ADMIN_KEY } });
    if (r.status === 401) throw new Error("unauthorized");
    return r.json();
  }

  async function tryLogin() {
    const pw = document.getElementById("pw").value.trim();
    if (!pw) return;
    ADMIN_KEY = pw;
    document.getElementById("gateErr").textContent = "Проверка…";
    try {
      await api("/overview");
      localStorage.setItem("sila_admin_key", pw);
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadAll(true);
      refreshTimer = setInterval(() => loadAll(false), 20000);
    } catch (e) {
      document.getElementById("gateErr").textContent = "Неверный пароль";
    }
  }

  document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });

  function timeAgo(iso) {
    if (!iso) return "—";
    const diffMs = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diffMs / 60000);
    if (m < 1) return "только что";
    if (m < 60) return m + " мин назад";
    const h = Math.floor(m / 60);
    if (h < 24) return h + " ч назад";
    const d = Math.floor(h / 24);
    return d + " дн назад";
  }
  function initials(name) { return (name || "?").trim().slice(0, 2).toUpperCase(); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  const STATUS_LABEL = { active: "Активен", cooling: "Остывает", dormant: "Спит", new: "Новый" };

  async function loadAll(showLoading) {
    try {
      const [overview, usersRes] = await Promise.all([api("/overview"), api("/users")]);
      renderCards(overview);
      allUsers = usersRes.users || [];
      renderUsers();
      document.getElementById("lastUpdated").textContent = "Обновлено: " + new Date().toLocaleTimeString("ru-RU");
    } catch (e) {
      if (e.message === "unauthorized") {
        localStorage.removeItem("sila_admin_key");
        document.getElementById("app").style.display = "none";
        document.getElementById("gate").style.display = "flex";
        clearInterval(refreshTimer);
      }
    }
  }

  function renderCards(o) {
    const activeBets = o.bets_by_status?.active || 0;
    const doneBets = o.bets_by_status?.done || 0;
    const failedBets = o.bets_by_status?.failed || 0;
    document.getElementById("cards").innerHTML = [
      ["Пользователей", o.total_users, ""],
      ["Новых за 7 дней", o.new_users_7d, "teal"],
      ["Активных ставок", activeBets, "gold"],
      ["Отчётов сегодня", o.reports_today, ""],
      ["Активны сегодня", o.active_users_today, "teal"],
      ["⭐ Застейкано всего", o.stake_paid_total_stars, "gold"],
      ["Сдержано / слито", doneBets + " / " + failedBets, ""],
      ["Комментариев", o.total_comments, ""],
    ].map(([l, v, cls]) => '<div class="card"><div class="v ' + cls + '">' + v + '</div><div class="l">' + l + '</div></div>').join("");
  }

  function setSort(key) {
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = key === "name" ? 1 : -1; }
    renderUsers();
  }

  function renderUsers() {
    const q = (document.getElementById("search").value || "").toLowerCase();
    const statusFilter = document.getElementById("statusFilter").value;
    let rows = allUsers.filter((u) => {
      if (statusFilter && u.status !== statusFilter) return false;
      if (!q) return true;
      return (u.name || "").toLowerCase().includes(q) || (u.username || "").toLowerCase().includes(q);
    });
    rows.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1; if (bv == null) return -1;
      if (typeof av === "string") return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });
    document.getElementById("usersBody").innerHTML = rows.length ? rows.map((u) => {
      const avatar = u.avatar_url
        ? '<img class="avatar" src="' + esc(u.avatar_url) + '">'
        : '<div class="avatar ph">' + esc(initials(u.name)) + '</div>';
      const riskTag = u.active_unreported_today > 0 ? '<div class="risk">' + u.active_unreported_today + ' без отчёта сегодня</div>' : "";
      return '<tr onclick="openUser(' + u.id + ')">' +
        '<td><div class="user-cell">' + avatar + '<div><div class="uname">' + esc(u.name) + '</div><div class="uhandle">@' + esc(u.username || "—") + '</div></div></div></td>' +
        '<td><span class="badge ' + u.status + '">' + STATUS_LABEL[u.status] + '</span>' + riskTag + '</td>' +
        '<td class="num">' + u.trust_level + '%</td>' +
        '<td class="num">' + u.current_streak + ' <span class="muted">/ ' + u.best_streak + '</span></td>' +
        '<td class="num">' + u.bets_active + ' <span class="muted">акт · ' + u.bets_done + ' держ · ' + u.bets_failed + ' слито</span></td>' +
        '<td class="num">' + u.stake_paid_total + '</td>' +
        '<td class="muted">' + timeAgo(u.last_activity_at) + '</td>' +
        '</tr>';
    }).join("") : '<tr><td colspan="7" class="d-empty">Никого не найдено</td></tr>';
  }

  async function openUser(id) {
    document.getElementById("overlay").style.display = "block";
    document.getElementById("drawer").style.display = "block";
    document.getElementById("drawerBody").innerHTML = '<div class="loading">Загрузка…</div>';
    try {
      const data = await api("/user?id=" + id);
      const u = data.user, m = data.metrics || {};
      const avatar = u.avatar_url
        ? '<img class="avatar" src="' + esc(u.avatar_url) + '">'
        : '<div class="avatar ph">' + esc(initials(u.name)) + '</div>';
      const bets = (data.bets || []).map((b) => {
        return '<div class="d-bet"><div class="row1"><span>' + esc(b.goal) + '</span><span class="badge ' + (b.status === "active" ? "active" : b.status === "done" ? "active" : b.status === "failed" ? "dormant" : "new") + '">' + esc(b.status) + '</span></div>' +
          '<div class="row2">' + esc(b.type) + ' · ' + b.duration_days + ' дн · ' + b.report_count + ' отчётов' + (b.stake ? ' · ⭐' + b.stake + (b.stake_paid ? "" : " (не оплачено)") : "") + '</div></div>';
      }).join("") || '<div class="d-empty">Ставок пока нет</div>';
      const comments = (data.recent_comments || []).map((c) => '<div class="d-bet">' + esc(c.text || "") + '<div class="row2">' + timeAgo(c.created_at) + '</div></div>').join("") || '<div class="d-empty">Комментариев нет</div>';
      const notifs = (data.recent_notifications || []).map((n) => '<div class="d-bet">' + esc(n.type) + '<div class="row2">' + timeAgo(n.created_at) + '</div></div>').join("") || '<div class="d-empty">Уведомлений нет</div>';

      document.getElementById("drawerBody").innerHTML =
        '<div class="d-head">' + avatar + '<div><h2>' + esc(u.name) + '</h2><div class="uhandle">@' + esc(u.username || "—") + ' · id ' + u.id + '</div></div></div>' +
        '<div class="d-stats">' +
        '<div class="d-stat"><b>' + (m.trust_level ?? 0) + '%</b><span>Доверие</span></div>' +
        '<div class="d-stat"><b>' + (m.current_streak ?? 0) + '</b><span>Серия</span></div>' +
        '<div class="d-stat"><b>' + (m.stake_paid_total ?? 0) + '</b><span>⭐ Всего</span></div>' +
        '<div class="d-stat"><b>' + (m.bets_total ?? 0) + '</b><span>Ставок</span></div>' +
        '<div class="d-stat"><b>' + (m.total_reports ?? 0) + '</b><span>Отчётов</span></div>' +
        '<div class="d-stat"><b>' + (m.challenges_total ?? 0) + '</b><span>Вызовов</span></div>' +
        '</div>' +
        '<div class="d-section-title">Ставки</div>' + bets +
        '<div class="d-section-title">Последние комментарии</div>' + comments +
        '<div class="d-section-title">Последние уведомления</div>' + notifs;
    } catch (e) {
      document.getElementById("drawerBody").innerHTML = '<div class="d-empty">Не удалось загрузить.</div>';
    }
  }

  function closeDrawer() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("drawer").style.display = "none";
  }

  if (ADMIN_KEY) {
    api("/overview").then(() => {
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadAll(true);
      refreshTimer = setInterval(() => loadAll(false), 20000);
    }).catch(() => { localStorage.removeItem("sila_admin_key"); });
  }
</script>

</body>
</html>
